<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coccole Fit</title>
    <meta name="description" content="Plataforma integral para la gestión de tareas diarias, control de asistencia, registro de incidencias, impulso de ventas sugeridas, cuadre de caja y tableros operativos de Coccole Fit." />
    <meta property="og:title" content="Coccole Fit" />
    <meta property="og:description" content="Plataforma integral para la gestión de tareas diarias, control de asistencia, registro de incidencias, impulso de ventas sugeridas, cuadre de caja y tableros operativos de Coccole Fit." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Ignore Vite HMR WebSocket errors in iframe environment per environment guidelines
      const _origConsoleError = console.error;
      console.error = function (...args) {
        if (
          args.some(
            arg =>
              typeof arg === 'string' &&
              (arg.includes('[vite] failed to connect to websocket') ||
                arg.includes('WebSocket closed without opened') ||
                arg.includes('@vite/client'))
          )
        ) {
          return;
        }
        _origConsoleError.apply(console, args);
      };
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (event.reason.message?.includes('WebSocket') ||
            event.reason.message?.includes('closed without opened') ||
            String(event.reason?.stack || '').includes('@vite/client'))
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
