<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Plataforma integral para la gestión de tareas diarias, control de asistencia, registro de incidencias, impulso de ventas sugeridas, cuadre de caja y tableros operativos de Coccole Fit." />
    <meta property="og:title" content="Coccole Fit" />
    <meta property="og:description" content="Plataforma integral para la gestión de tareas diarias, control de asistencia, registro de incidencias, impulso de ventas sugeridas, cuadre de caja y tableros operativos de Coccole Fit." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Prevent Vite HMR WebSocket errors in iframe environment where HMR is disabled
      (function () {
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          const PatchedWebSocket = function (url, protocols) {
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
              return {
                url: String(url || ''),
                readyState: 1,
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                send: function () {},
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
              };
            }
            return protocols !== undefined
              ? new OrigWebSocket(url, protocols)
              : new OrigWebSocket(url);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
